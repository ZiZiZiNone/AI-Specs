name: AI-Specs v3.0 Full-Stack Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install TypeScript CLI
        run: npm install -g typescript
      - name: Run All 23 Full-Stack Gates (Python / TS / Node / Vue 3 / React / Miniprogram / Go / PHP / Java / Rust)
        run: python3 scripts/check-all.py
